
services:
  db:
    image: postgres:15
    container_name: database_container
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: lima
      POSTGRES_PASSWORD: 141925
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lima -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blog_container
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blog_db
      SPRING_DATASOURCE_USERNAME: lima
      SPRING_DATASOURCE_PASSWORD: 141925
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
