services:
  db:
    image: postgres:15
    container_name: database_container
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: lima
      POSTGRES_PASSWORD: 141925
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: blog_container
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blog_db
      SPRING_DATASOURCE_USERNAME: lima
      SPRING_DATASOURCE_PASSWORD: 141925
      SPRNIG_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  postgres_data: